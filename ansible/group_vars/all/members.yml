---
# ================================================================
# THÀNH VIÊN NHÓM — nguồn duy nhất cho user Linux, SSH key, sudo, VPN
# ================================================================
# Sửa xong chạy (trong ansible/):
#   ansible-playbook site.yml --vault-password-file ~/.ansible/linux-project.vault_pass
# Quy trình đầy đủ: docs/ssh-access.md mục 6.
#
# Mỗi thành viên:
#   name      : user Linux (chữ thường, không dấu)
#   comment   : tên + vai, hiện trong /etc/passwd
#   ssh_key   : SSH public key (1 dòng). Chưa có → chưa tạo user ở đâu cả
#   wireguard : { ip, public_key } — tuỳ chọn; có thì được vào VPN (10.8.0.1 là Bastion)
#   access    : quyền theo máy (khoá = group inventory: bastion / web / backup)
#                 full  → sudo đầy đủ, phải nhập mật khẩu (hash ở group_vars/all/vault.yml)
#                 login → chỉ đăng nhập (vd đi qua Bastion bằng ProxyJump)
#                 [..]  → sudo giới hạn: danh sách profile ở roles/common/defaults/main.yml
#               Máy không ghi ở đây → không có user (đang có thì bị gỡ).
# Public key KHÔNG phải bí mật nên để chữ thường ở đây.

members:
