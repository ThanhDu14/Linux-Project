    comment: "Dự — TV1 Hạ tầng"
    ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICaBXG1AvRXzPxnb3yNGLkp1p0h/oAS3yF8l3SRNhfpD du@linux-project"
    wireguard:
      ip: 10.8.0.2
