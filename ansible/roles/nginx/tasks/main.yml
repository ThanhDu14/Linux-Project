---
- name: Kiểm tra đủ template trong config/nginx/
  ansible.builtin.assert:
    that:
      - (nginx_config_src ~ '/' ~ item) is file
    fail_msg: "Thiếu {{ nginx_config_src }}/{{ item }} (Thành viên 2 sở hữu)"
    quiet: true
  loop: "{{ nginx_sites | map(attribute='template') | list + [nginx_default_site.template, nginx_hardening_template, nginx_status_page] }}"
  run_once: true

# Chỉ gọi apt khi chưa có nginx: VM1 ở private subnet, cần NAT (enable_nat = true) mới cài được
- name: Liệt kê gói đã cài
  ansible.builtin.package_facts:
    manager: apt

- name: Cài nginx (cần NAT)
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: "'nginx' not in ansible_facts.packages"

# ---------- Chứng chỉ TLS ----------
# Trong khối >- (YAML không xử lý escape) viết '\.' — '\\.' ở đây KHÔNG khớp dấu chấm
- name: Chọn cách cấp chứng chỉ TLS
  ansible.builtin.set_fact:
    nginx_tls_effective_mode: >-
      {{ nginx_tls_mode if nginx_tls_mode != 'auto'
         else ('selfsigned' if nginx_tls_names | select('search', '\.lab\.local$') | list | length > 0
               else 'letsencrypt') }}

- name: Kiểm tra chế độ TLS hợp lệ
  ansible.builtin.assert:
    that:
      - nginx_tls_effective_mode in ['selfsigned', 'letsencrypt']
      - nginx_tls_effective_mode == 'selfsigned' or (nginx_tls_names | select('search', '\.lab\.local$') | list | length == 0)
    fail_msg: "nginx_tls_mode={{ nginx_tls_mode }} không hợp lệ, hoặc Let's Encrypt không cấp cho tên *.lab.local"
    quiet: true

- name: "TLS: {{ nginx_tls_effective_mode }}"
  ansible.builtin.include_tasks: "tls_{{ nginx_tls_effective_mode }}.yml"

- name: Quyền private key TLS (chỉ root đọc)
  ansible.builtin.file:
    path: "{{ nginx_tls_key }}"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode # --check: key chưa được tạo thật

# ---------- Trang tĩnh status.lab.local ----------
- name: Thư mục {{ nginx_status_root }}
  ansible.builtin.file:
    path: "{{ nginx_status_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Trang chào mừng (config/nginx/{{ nginx_status_page }})
  ansible.builtin.template:
    src: "{{ nginx_config_src }}/{{ nginx_status_page }}"
    dest: "{{ nginx_status_root }}/index.html"
    owner: root
    group: root
    mode: "0644"

# ---------- Vhost ----------
- name: Render vhost vào sites-available
  ansible.builtin.template:
    src: "{{ nginx_config_src }}/{{ item.template }}"
    dest: "/etc/nginx/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

- name: Bật vhost (symlink sites-enabled)
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
    state: link
    force: true # --check: file trong sites-available chưa được render thật
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

- name: Render server mặc định ({{ nginx_default_site.template }})
  ansible.builtin.template:
    src: "{{ nginx_config_src }}/{{ nginx_default_site.template }}"
    dest: "/etc/nginx/sites-available/{{ nginx_default_site.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Bật server mặc định
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_default_site.name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ nginx_default_site.name }}.conf"
    state: link
    force: true
  notify: Reload nginx

# Role sở hữu mọi *.conf trong sites-available/sites-enabled: vhost không còn trong nginx_sites
# (vd đổi *.lab.local → domain Route 53) bị gỡ, tránh 2 bộ vhost cùng chạy
- name: Liệt kê vhost *.conf đang có
  ansible.builtin.find:
    paths: [/etc/nginx/sites-available, /etc/nginx/sites-enabled]
    patterns: "*.conf"
    file_type: any
  register: nginx_existing_sites

- name: Gỡ vhost cũ không còn trong nginx_sites
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ nginx_existing_sites.files | map(attribute='path')
       | reject('search', '/(' ~ (nginx_wanted_files | map('regex_escape') | join('|')) ~ ')$') | list }}
  vars:
    nginx_wanted_files: "{{ (nginx_sites | map(attribute='name') | list + [nginx_default_site.name]) | map('regex_replace', '$', '.conf') | list }}"
  notify: Reload nginx

# Site mặc định của Ubuntu chiếm default_server cổng 80 → tắt để request không có Host rơi vào vhost của nhóm
- name: Tắt site mặc định của Ubuntu
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

# ---------- Gia cố chung ----------
- name: Gia cố chung cho mọi vhost (conf.d/role2-hardening.conf)
  ansible.builtin.template:
    src: "{{ nginx_config_src }}/{{ nginx_hardening_template }}"
    dest: /etc/nginx/conf.d/role2-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

# Ubuntu khai báo sẵn 2 dòng này trong khối http của nginx.conf (22.04: còn bật TLSv1, TLSv1.1)
- name: "nginx.conf: ssl_protocols, ssl_prefer_server_ciphers"
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*#?\s*{{ item.key }}\s'
    line: "\t{{ item.key }} {{ item.value }};"
    insertafter: '^http\s*\{'
  loop:
    - { key: ssl_protocols, value: "{{ nginx_ssl_protocols }}" }
    - { key: ssl_prefer_server_ciphers, value: "{{ nginx_ssl_prefer_server_ciphers }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: Reload nginx

- name: Bật và chạy nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
