---
# site.yml — điều phối toàn bộ cấu hình. Chạy (trong ansible/):
#   ansible-playbook site.yml --vault-password-file ~/.ansible/linux-project.vault_pass
# (không có file mật khẩu thì dùng --ask-vault-pass)
# Các role khác (toolkit, ...) sẽ được thêm vào đây.

- name: Tất cả máy — cơ bản + user/SSH key/sudo của thành viên
  hosts: all
  become: true
  roles:
    - common

# Sau common: AllowUsers chỉ chứa user đã được common tạo. Cấu hình của Thành viên 2 trong config/{sysctl,modprobe,ssh,audit,ufw}/
- name: Tất cả máy — gia cố kernel, SSH, auditd, UFW
  hosts: all
  become: true
  roles:
    - os_hardening
    - ssh_hardening
    - auditd
    - firewall

# Ổ EBS dữ liệu: VM1 /data, VM2 /backup (group_vars/<group>/storage.yml)
- name: VM1 + VM2 — mount ổ EBS dữ liệu
  hosts: private
  become: true
  roles:
    - storage

# Cấu hình của TV4 trong config/postgresql/. Cần /data (storage) → đặt sau play trên.
- name: VM1 — PostgreSQL (dữ liệu trên /data, chỉ nghe localhost)
  hosts: web
  become: true
  roles:
    - postgresql

# App todo (app/): API Flask (systemd, 127.0.0.1:5000) + giao diện tĩnh cho Nginx. Cần bảng của init.sql → sau postgresql.
- name: VM1 — app todo (Flask + gunicorn)
  hosts: web
  become: true
  roles:
    - app

# Sao lưu của TV4: VM1 → rsync → VM2 → S3. Cần /data, /backup (storage) + PostgreSQL → đặt sau 2 play trên.
# Chạy cùng lúc trên cả 2 máy (VM2 cần public key của VM1) — không --limit chỉ 1 máy.
- name: VM1 + VM2 — sao lưu (timer 02:00 / 02:30, off-site S3)
  hosts: web:backup
  become: true
  roles:
    - backup

- name: Bastion — VPN WireGuard (cửa vào cho nhóm quản trị)
  hosts: bastion
  become: true
  roles:
    - wireguard

- name: VM1 — Nginx reverse proxy + TLS + gia cố (cấu hình của Thành viên 2 trong config/nginx/)
  hosts: web
  become: true
  roles:
    - nginx

# CUỐI CÙNG: jail đọc log của dịch vụ (nginx, ...) — chạy trước khi dịch vụ được cài thì chưa có file log,
# fail2ban không khởi động được. Thêm dịch vụ mới có jail → đặt play của nó PHÍA TRÊN play này.
- name: Tất cả máy — fail2ban (config/fail2ban/ của Thành viên 2)
  hosts: all
  become: true
  roles:
    - fail2ban
