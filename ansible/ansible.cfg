[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
interpreter_python = auto_silent

# Tăng tốc: mỗi task 1 lượt SSH (pipelining) + giữ kết nối mở để task sau dùng lại (ControlPersist).
# ProxyCommand qua Bastion trong inventory vẫn giữ nguyên (ansible_ssh_common_args/extra_args).
[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
