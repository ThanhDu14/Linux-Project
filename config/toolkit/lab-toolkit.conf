# /etc/lab-toolkit.conf — shared configuration for the operations toolkit.
# Bash syntax; owner root:root and mode 0644 (no secrets in this file).

# Deploy configuration: deploy artifacts only to configured toolkit paths; secrets stay outside this file.
APP_SERVICE=app.service
APP_OWNER=todo:todo
APP_SRC_DIR=/opt/lab-deploy-staging
APP_DEST_DIR=/opt/todo-app
DEPLOY_BACKUP_DIR=/var/backups/lab-deploy
DEPLOY_KEEP=5
NGINX_SITES_DIR=/etc/nginx
APP_DOMAIN=app.lab.local
STATUS_DOMAIN=status.lab.local
# VM1 app health is plain HTTP on loopback. This does not expose it externally.
HEALTH_URL=http://127.0.0.1:5000/health

# Health-check values are host-specific; Ansible should render separate files per VM.
# VM1 sample (VM2 should use HC_MODE=remote and HC_CHECK_LOCAL_HTTP=no).
HC_MODE=local
HC_CHECK_LOCAL_HTTP=yes
HC_REMOTE_URL=https://10.0.2.10/health
HC_APP_DOMAIN=app.lab.local
HC_CPU_MAX=85
HC_RAM_MAX=85
HC_DISK_MAX=80
HC_DISK_MOUNTS="/ /data"
HC_SERVICES="nginx postgresql app.service"
HC_PORTS="80 443 5000 5432"
HC_CHECK_BACKUP_UNIT=lab-backup.service
HC_COOLDOWN_SEC=300

# Logs and alerts. Keep ALERT_TO empty until a working recipient is configured.
TOOLKIT_LOG=/var/log/lab-toolkit.log
LOGROTATE_TARGET=/var/log/lab-toolkit.log
LOGROTATE_KEEP=5
ALERT_TO=
