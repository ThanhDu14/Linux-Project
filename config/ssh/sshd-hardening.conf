PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
# AllowUsers is generated per host by Ansible (role ssh_hardening → 01-allowusers.conf) from ansible/group_vars/all/members.yml.

# --- Lynis SSH-7408 ---
# Tối đa 3 lần thử xác thực / kết nối (client nên dùng IdentitiesOnly=yes nếu ssh-agent có nhiều key)
MaxAuthTries 3
# Ghi fingerprint của key đã đăng nhập → biết AI vào (auth.log / journald)
LogLevel VERBOSE
X11Forwarding no
AllowAgentForwarding no
Compression no
# Phiên treo: hỏi mỗi 5 phút, 2 lần không trả lời → ngắt
ClientAliveInterval 300
ClientAliveCountMax 2
# --- Lynis BANN-7130 ---
Banner /etc/issue.net
