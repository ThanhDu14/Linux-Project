# /etc/lab-backup.conf — cấu hình cho backup.sh, restore.sh (VM1) và backup-offsite.sh (VM2) — TV4
# Chủ root:root, quyền 600. Cú pháp Bash (KEY=value, không dấu cách quanh dấu =).
# Mọi giá trị đều có mặc định trong scripts/lib/backup-common.sh; chỉ ghi cái muốn đổi.

# ---------- VM1 (web-app-db-01) ----------
DB_NAME=appdb
# Nội dung web cần sao lưu (Nginx của TV2 phục vụ /var/www/role2-status)
WEB_DIR=/var/www
# Bản sao lưu cục bộ nằm trên EBS /data
BACKUP_DIR=/data/backup
RETENTION_DAYS=7
# Sau khi sao lưu phải còn trống ít nhất chừng này MB, nếu không thì huỷ trước khi ghi
MIN_FREE_MB=200
# Đích rsync: user rbackup trên VM2, bị khoá bằng rrsync -wo /backup/incoming
REMOTE=rbackup@10.0.2.20
SSH_KEY=/root/.ssh/backup_ed25519
# Unit systemd của app Flask (TV3) — restore.sh dừng nó trong lúc khôi phục DB. Để trống nếu chưa có.
APP_SERVICE=app.service
# Gửi mail khi backup/restore lỗi (msmtp do TV5 cấu hình). Để trống = chỉ ghi log.
ALERT_TO=

# ---------- VM2 (backup-01) ----------
INCOMING_DIR=/backup/incoming
# Lấy từ: terraform -chdir=terraform/environments/shared output -raw backup_bucket_name
S3_BUCKET=
S3_PREFIX=web-app-db-01
AWS_REGION=ap-southeast-1
