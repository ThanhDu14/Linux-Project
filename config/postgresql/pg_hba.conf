# pg_hba.conf — TV4
# Đặt tại: /etc/postgresql/14/main/pg_hba.conf  (chủ postgres:postgres, quyền 640)
# PostgreSQL đọc từ trên xuống, dùng DÒNG KHỚP ĐẦU TIÊN. Không dòng nào khớp = từ chối.

# TYPE  DATABASE  USER      ADDRESS        METHOD

# Quản trị: chỉ user hệ điều hành "postgres" qua Unix socket (sudo -u postgres psql).
# Script backup/restore cũng chạy pg_dump/pg_restore bằng user này.
local   all       postgres                 peer

# Ứng dụng Flask: chỉ được vào DB appdb, chỉ từ chính máy này, bắt buộc mật khẩu SCRAM.
host    appdb     app_user  127.0.0.1/32   scram-sha-256
host    appdb     app_user  ::1/128        scram-sha-256

# Mọi kết nối còn lại: từ chối tường minh (cho dễ đọc khi báo cáo).
local   all       all                      reject
host    all       all       0.0.0.0/0      reject
host    all       all       ::/0           reject
