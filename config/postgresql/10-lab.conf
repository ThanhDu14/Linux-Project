# Drop-in cho PostgreSQL 14 trên Ubuntu 22.04 — TV4
# Đặt tại: /etc/postgresql/14/main/conf.d/10-lab.conf
# (postgresql.conf gốc của Ubuntu có sẵn dòng include_dir = 'conf.d', file này ghi đè giá trị mặc định)
#
# Thư mục dữ liệu nằm trên EBS /data: cluster được tạo bằng
#   pg_createcluster 14 main -d /data/pgdata
# nên data_directory đã được ghi vào postgresql.conf, không lặp lại ở đây.

# Chỉ nghe trên loopback (127.0.0.1 và ::1) — không truy cập được từ ngoài máy.
# Chứng minh: ss -tlnp | grep 5432
listen_addresses = 'localhost'
port = 5432

# Mật khẩu băm bằng SCRAM-SHA-256 thay cho md5 (md5 dễ bị tấn công replay/từ điển hơn)
password_encryption = 'scram-sha-256'

# Ghi log kết nối để truy vết ai vào DB (xem bằng journalctl / /var/log/postgresql)
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
