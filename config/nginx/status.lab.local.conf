server {
    listen 80;
    server_name status.lab.local;

    return 301 https://status.lab.local$request_uri;
}

server {
    listen 443 ssl;
    server_name status.lab.local;

    ssl_certificate /etc/ssl/certs/role2-lab.crt;
    ssl_certificate_key /etc/ssl/private/role2-lab.key;

    root /var/www/role2-status;
    index index.html;
}
